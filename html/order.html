<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    LZL Store | Order
  </title>

  <link
    rel="stylesheet"
    href="../css/store.css"
  >

  <link
    rel="stylesheet"
    href="../css/order.css"
  >

</head>


<body>


  <header class="store-header">

    <div class="store-logo">

      <h1>
        LZL
      </h1>

      <span>
        STORE
      </span>

    </div>


    <nav class="store-nav">

      <a href="./store.html">
        Store
      </a>

      <a href="./account.html">
        Account
      </a>

      <a href="./account.html#myOrders">
        Orders
      </a>

    </nav>


    <div class="header-actions">

      <button
        id="cartButton"
        class="header-button cart-button"
        type="button"
      >
        Cart

        <span id="cartCount">
          0
        </span>

      </button>


      <button
        id="accountButton"
        class="header-button"
        type="button"
      >
        Account
      </button>

    </div>

  </header>


  <main class="order-page">


    <div class="order-topbar">

      <a
        href="./account.html#myOrders"
        class="back-orders"
      >
        Back to My Orders
      </a>

    </div>


    <section
      id="orderContainer"
      class="order-container"
    >

      <div class="order-loading">

        <div class="order-loader"></div>

        <span>
          Loading order...
        </span>

      </div>

    </section>


  </main>


  <footer class="store-footer">

    <div class="footer-brand">

      <h3>
        LZL STORE
      </h3>

      <p>
        Roblox Limited marketplace.
      </p>

    </div>


    <div class="footer-links">

      <a href="#">
        Terms
      </a>

      <a href="#">
        Privacy
      </a>

      <a href="#">
        Contact
      </a>

    </div>

  </footer>


  <script
    type="module"
    src="../js/order.js"
  ></script>


</body>

</html>
